<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7Teen Café</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF1E1;
    --card:#FFFDF8;
    --text:#2B2420;
    --text-soft:rgba(43,36,32,.55);
    --text-soft2:rgba(43,36,32,.5);
    --border:rgba(43,36,32,.06);
    --accent:#1C7FC1;
    --accent-dark:#145E90;
    --chip-bg:#F1EAD9;
    --chip-text:#5A4E3F;
    --info-bg:#E7F2FA;
    --info-text:#145E90;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);font-family:"Nunito",system-ui,sans-serif;color:var(--text);height:100%}
  body{-webkit-tap-highlight-color:transparent}
  a{color:var(--accent)}
  ::-webkit-scrollbar{display:none}
  @keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes fadeUp{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}

  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}

  /* Header */
  #header{flex-shrink:0;height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;position:sticky;top:0;z-index:5}
  #header .back-btn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text);cursor:pointer;visibility:hidden}
  #header .back-btn.show{visibility:visible}
  #header .back-btn:active{background:rgba(43,36,32,.1)}
  #header .title{position:absolute;left:0;right:0;text-align:center;font-weight:800;font-size:16px;letter-spacing:-.2px;pointer-events:none}
  #header .close-btn{margin-left:auto;width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(43,36,32,.06);cursor:pointer;position:relative;z-index:6;visibility:hidden}
  #header .close-btn.show{visibility:visible}

  /* Content */
  #content{flex:1;overflow-y:auto;position:relative;padding-bottom:24px}

  /* Home */
  .home-top{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
  .home-top img.logo{width:40px;height:40px;border-radius:20px;flex-shrink:0;object-fit:cover}
  .home-top .greet{flex:1;min-width:0}
  .home-top .greet .hey{font-size:13px;color:var(--text-soft);font-weight:600}
  .home-top .greet .q{font-size:17px;font-weight:800}
  .stamp-badge{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--info-bg);border-radius:20px;padding:7px 12px;cursor:pointer}
  .stamp-badge:active{background:#d9ecf9}
  .stamp-badge .n{font-size:13px;font-weight:800;color:var(--info-text)}

  .cat-row{padding:6px 16px 12px;display:flex;gap:8px;overflow-x:auto}
  .cat-chip{flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;background:var(--chip-bg);color:var(--chip-text)}
  .cat-chip.active{background:var(--accent);color:#fff}

  .list-toolbar{padding:0 16px 8px;display:flex;justify-content:flex-end}
  .layout-toggle{display:flex;gap:3px;background:var(--chip-bg);border-radius:12px;padding:3px}
  .layout-toggle .lt-btn{width:30px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:14px;cursor:pointer;color:var(--chip-text)}
  .layout-toggle .lt-btn.active{background:var(--accent);color:#fff}

  .day-toggle{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .day-toggle .d-opt{flex:1 1 0;min-width:38px;text-align:center;padding:10px 4px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-weight:700;font-size:12.5px;cursor:pointer}
  .day-toggle .d-opt.active{background:var(--accent);color:#fff}

  .item-list{padding:4px 16px 100px;display:flex;flex-direction:column;gap:10px}
  .item-card{display:flex;gap:12px;padding:10px;background:var(--card);border-radius:18px;border:1px solid var(--border)}
  .item-thumb{width:72px;height:72px;border-radius:14px;flex-shrink:0;cursor:pointer;background:repeating-linear-gradient(135deg,var(--info-bg),var(--info-bg) 8px,#dceefa 8px,#dceefa 16px);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .item-thumb img{width:100%;height:100%;object-fit:cover}
  .item-thumb .lbl{font-family:ui-monospace,monospace;font-size:8px;color:#7fa8c4;text-align:center;padding:4px;line-height:1.3;white-space:pre-line}
  .item-info{flex:1;cursor:pointer;min-width:0}
  .item-info .nm{font-weight:800;font-size:14.5px}
  .item-info .ds{font-size:12px;color:var(--text-soft2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-info .pr{font-weight:800;font-size:14px;color:var(--accent);margin-top:4px}
  .qty-pill{flex-shrink:0;display:flex;align-items:center;gap:8px;align-self:center;background:var(--accent);border-radius:14px;padding:4px}
  .qty-pill .btn{width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
  .qty-pill .n{min-width:14px;text-align:center;color:#fff;font-weight:800;font-size:13px}
  .add-btn{flex-shrink:0;align-self:center;width:30px;height:30px;border-radius:15px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;cursor:pointer}
  .add-btn:active{background:var(--accent-dark)}

  /* Home — grid (horizontal) layout */
  .item-grid{padding:4px 16px 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .grid-card{background:var(--card);border-radius:18px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
  .grid-thumb{width:100%;aspect-ratio:1/1;cursor:pointer;background:repeating-linear-gradient(135deg,var(--info-bg),var(--info-bg) 8px,#dceefa 8px,#dceefa 16px);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .grid-thumb img{width:100%;height:100%;object-fit:cover}
  .grid-thumb .lbl{font-family:ui-monospace,monospace;font-size:8px;color:#7fa8c4;text-align:center;padding:4px;line-height:1.3;white-space:pre-line}
  .grid-info{padding:8px 10px 2px;cursor:pointer;min-width:0}
  .grid-info .nm{font-weight:800;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid-info .prx�nt-weight:800;font-size:13px;color:var(--accent);margin-top:3px}
  .grid-ctrl{padding:6px 10px 10px;display:flex;justify-content:flex-end}

  /* Item detail */
  .item-hero{width:100%;aspect-ratio:1/1;background:repeating-linear-gradient(135deg,var(--info-bg),var(--info-bg) 10px,#dceefa 10px,#dceefa 20px);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .item-hero img{width:100%;height:100%;object-fit:cover}
  .item-hero .lbl{font-family:ui-monospace,monospace;font-size:11px;color:#7fa8c4;white-space:pre-line;text-align:center}
  .detail-body{padding:20px 20px 130px}
  .detail-body .nm{font-weight:900;font-size:22px}
  .detail-body .pr{font-weight:800;font-size:17px;color:var(--accent);margin-top:4px}
  .detail-body .ds{font-size:14px;line-height:1.6;color:rgba(43,36,32,.65);margin-top:12px}
  .sec-label{font-weight:700;font-size:14px;margin-bottom:8px;margin-top:24px}
  .sugar-row{display:flex;gap:6px}
  .sugar-chip{flex:1;text-align:center;padding:10px 4px;border-radius:14px;cursor:pointer;background:var(--chip-bg);color:var(--chip-text);font-size:12.5px;font-weight:700}
  .sugar-chip.active{background:var(--accent);color:#fff}
  .addon-row{display:flex;flex-direction:column;gap:8px}
  .addon-chip{padding:9px 14px;border-radius:14px;cursor:pointer;font-size:12.5px;font-weight:700;background:var(--chip-bg);color:var(--chip-text)}
  .addon-chip.active{background:var(--accent);color:#fff}
  .addon-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--chip-bg)}
  .addon-item .lbl{font-size:12.5px;font-weight:700;color:var(--chip-text)}
  .addon-item .ctrl{display:flex;align-items:center;gap:10px}
  .addon-item .ctrl .btn{width:24px;height:24px;border-radius:12px;background:var(--card);color:var(--chip-text);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
  .addon-item .ctrl .n{min-width:14px;text-align:center;font-weight:800;font-size:13px}
  .date-hint{font-size:11.5px;color:var(--text-soft2);margin-top:6px}
  .qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding:14px 16px;background:var(--card);border-radius:16px;border:1px solid var(--border)}
  .qty-row .lbl{font-weight:700;font-size:14px}
  .qty-row .ctrl{display:flex;align-items:center;gap:14px}
  .qty-row .ctrl .btn{width:30px;height:30px;border-radius:15px;background:var(--info-bg);color:var(--info-text);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
  .qty-row .ctrl .n{min-width:16px;text-align:center;font-weight:800;font-size:15px}

  .sub-link{margin-top:16px;text-align:center;padding:12px;border-radius:14px;background:var(--info-bg);color:var(--info-text);font-weight:700;font-size:13px;cursor:pointer}
  .sub-link:active{background:#d9ecf9}
  .date-input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-family:inherit;font-size:14px;color:var(--text)}
  .sub-summary{margin-top:20px;padding:14px 16px;background:var(--card);border-radius:16px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .sub-summary .row{display:flex;justify-content:space-between;font-size:13px;color:rgba(43,36,32,.6)}
  .sub-summary .row.total{font-size:16px;font-weight:800;color:var(--text);margin-top:4px;padding-top:8px;border-top:1px solid rgba(43,36,32,.1)}
  .pay-sub-summary{margin-top:16px;padding:12px 16px;background:var(--card);border-radius:14px;border:1px solid var(--border);font-size:13px;color:rgba(43,36,32,.7);line-height:1.5}

  /* Cart */
  .empty-cart{padding:80px 30px;text-align:center;color:var(--text-soft2)}
  .empty-cart .t1{font-size:15px;font-weight:700}
  .empty-cart .t2{font-size:13px;margin-top:6px}
  .cart-list{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .cart-row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--card);border-radius:16px;border:1px solid var(--border)}
  .cart-row .thumb{width:52px;height:52px;border-radius:12px;flex-shrink:0;overflow:hidden;background:repeating-linear-gradient(135deg,var(--info-bg),var(--info-bg) 6px,#dceefa 6px,#dceefa 12px)}
  .cart-row .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .cart-row .info{flex:1;min-width:0}
  .cart-row .info .nm{font-weight:700;font-size:14px}
  .cart-row .info .dt{font-size:11.5px;color:var(--text-soft2);margin-top:1px}
  .cart-row .info .pr{font-weight:800;font-size:13px;color:var(--accent);margin-top:2px}
  .cart-row .ctrl{display:flex;align-items:center;gap:8px;background:var(--chip-bg);border-radius:14px;padding:4px}
  .cart-row .ctrl .btn{width:22px;height:22px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
  .cart-row .ctrl .n{min-width:14px;text-align:center;font-weight:800;font-size:13px}

  .redeem-row{margin:4px 16px;padding:12px 14px;border-radius:14px;background:var(--info-bg);display:flex;align-items:center;justify-content:space-between;cux�or:pointer}
  .redeem-row .lbl{font-size:13px;font-weight:700;color:var(--info-text)}
  .toggle{width:38px;height:22px;border-radius:11px;background:rgba(43,36,32,.15);position:relative;flex-shrink:0;transition:background .15s}
  .toggle.on{background:var(--accent)}
  .toggle .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9px;background:#fff;transition:left .15s}
  .toggle.on .dot{left:18px}

  .remark-box{margin:12px 16px 4px}
  .remark-box .remark-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--text-soft);margin-bottom:6px}
  .remark-box .remark-label .count{font-weight:600;color:var(--text-soft2)}
  .remark-box textarea{width:100%;min-height:56px;resize:none;border:1px solid var(--border);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--card)}
  .remark-box textarea:focus{outline:none;border-color:var(--accent)}

  .totals{padding:14px 16px 130px;display:flex;flex-direction:column;gap:6px}
  .totals .row{display:flex;justify-content:space-between;font-size:13px;color:rgba(43,36,32,.6)}
  .totals .row.discount{color:var(--accent)}
  .totals .row.total{font-size:16px;font-weight:800;color:var(--text);margin-top:6px;padding-top:10px;border-top:1px solid rgba(43,36,32,.1)}

  /* KHQR payment */
  .pay-wrap{padding:24px 24px 130px;text-align:center}
  .pay-wrap .t1{font-weight:900;font-size:18px}
  .pay-wrap .t2{font-size:13px;color:var(--text-soft);margin-top:4px}
  .qr-box{margin:20px auto 0;width:220px;height:220px;border-radius:20px;background:var(--card);border:1px solid rgba(43,36,32,.1);padding:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .qr-box img{width:100%;height:100%;object-fit:contain;border-radius:10px}
  .qr-actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
  .qr-actions .qbtn{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:14px;background:var(--info-bg);color:var(--info-text);font-size:12.5px;font-weight:700;cursor:pointer}
  .qr-actions .qbtn:active{background:#d9ecf9}
  .pay-wrap .due-lbl{margin-top:20px;font-size:13px;color:var(--text-soft2)}
  .pay-wrap .due-val{font-weight:900;font-size:30px;color:var(--accent);margin-top:2px}
  .pay-note{margin-top:22px;padding:12px 16px;background:var(--info-bg);border-radius:14px;font-size:12.5px;color:var(--info-text);font-weight:600;text-align:left}

  /* Confirmation */
  .confirm-wrap{padding:40px 24px 40px;text-align:center}
  .confirm-wrap .check{width:76px;height:76px;border-radius:38px;background:var(--accent);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:popIn .5s ease}
  .confirm-wrap .t1{font-weight:900;font-size:20px;margin-top:18px}
  .confirm-wrap .t2{font-size:13px;color:var(--text-soft);margin-top:4px}
  .pickup-box{margin-top:24px;padding:18px;background:var(--card);border-radius:18px;border:1px dashed rgba(43,36,32,.15)}
  .pickup-box .lbl{font-size:11px;letter-spacing:1px;color:rgba(43,36,32,.45);font-weight:700}
  .pickup-box .code{font-size:28px;font-weight:900;color:var(--accent);letter-spacing:1px;margin-top:4px}
  .order-time{margin-top:8px;font-size:11.5px;color:var(--text-soft2)}
  .owner-notice{margin-top:14px;display:f&lex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--info-text);font-weight:700;animation:fadeUp .3s ease}
  .sub-valid-box{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--info-bg);color:var(--info-text);font-size:13px;font-weight:600}
  .pay-status{margin-top:14px;padding:10px 16px;border-radius:14px;font-size:12.5px;font-weight:700;display:inline-block;animation:fadeUp .3s ease}
  .pay-status.accepted{background:#E4F5E9;color:#1E7A46}
  .pay-status.pending{background:var(--info-bg);color:var(--info-text)}
  .pay-status.paid{background:#E4F5E9;color:#1E7A46}
  .pay-status.unpaid{background:#FBEAEA;color:#B23A3A}
  .steps{margin-top:26px;display:flex;justify-content:space-between;padding:0 6px}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .step .dot{width:28px;height:28px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .step .lbl{font-size:11px;font-weight:700}
  .step-line{flex:1;height:28px;display:flex;align-items:center}
  .step-line .bar{height:2px;flex:1}
  .status-msg{margin-top:20px;font-size:13px;color:rgba(43,36,32,.6)}

  /* Rewards */
  .rewards-wrap{padding:20px 20px 100px}
  .stamp-card{background:var(--accent);border-radius:20px;padding:20px;color:#fff;text-align:center}
  .stamp-card .lbl{font-size:12px;opacity:.85;font-weight:700}
  .stamp-card .n{font-size:34px;font-weight:900;margin-top:4px}
  .stamp-icons{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .stamp-icon{width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:14px}
  .stamp-icon.filled{background:rgba(255,255,255,.95);color:var(--accent)}
  .stamp-card .sub{font-size:11.5px;opacity:.85;margin-top:10px}
  .free-cups-box{margin-top:20px;padding:14px;background:var(--card);border-radius:16px;border:1px solid var(--border);text-align:center}
  .free-cups-box .t1{font-weight:800;font-size:14px}
  .free-cups-box .t2{font-size:12px;color:var(--text-soft2);margin-top:4px}
  .reward-msg{margin-top:16px;padding:12px 14px;background:var(--info-bg);border-radius:14px;font-size:12.5px;color:var(--info-text);font-weight:700;animation:fadeUp .3s ease}

  /* Floating cart bar */
  #cart-bar{position:fixed;left:16px;right:16px;bottom:16px;max-width:390px;margin:0 auto;height:50px;border-radius:16px;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 8px 20px rgba(28,127,193,.35);z-index:6}
  #cart-bar.show{display:flex}

  /* Fallback main button (used when not inside Telegram) */
  #main-btn-wrap{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;padding:8px 16px 20px;background:linear-gradient(to top,var(--bg) 60%,rgba(251,241,225,0));display:none;z-index:6}
  #main-btn-wrap.show{display:block}
  #main-btn{height:50px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;cursor:pointer}
  #main-btn:active{background:var(--accent-dark)}

  #content.has-fallback-btn{padding-bottom:90px}

  @media (min-width:480px){
    #app{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="back-btn" id="backBtn">‹</div>
    <div class="title" id="headerTitle">7Teen Café</div>
    <div class="close-btn" id="closeBtn">✕</div>
  </div>
  <div id="content"></div>
  <div id="cart-bar"></div>
  <div id="main-btn-wrap"><div id="main-btn"></div></div>
</div>

<script>
(function(){
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var ORDER_ENDPOINT = "/api/order";
  var ORDER_STATUS_ENDPOINT = "/api/order-status";

  var MENU = [
    // Coffee
    { id:'7teen-cafe', name:'7Teen Cafe', desc:'', price:1.5, category:'Coffee', imgLabel:'photo:\n7teen cafe', photo:'assets/7teen-cafe.jpg' },
    { id:'ice-latte', name:'Ice Latte', desc:'', price:1.5, category:'Coffee', imgLabel:'photo:\nice latte', photo:'assets/ice-latte.jpg' },
    { id:'ice-americano', name:'Ice Americano', desc:'', price:1.25, category:'Coffee', imgLabel:'photo:\nice americano', photo:'assets/ice-americano.jpg' },
    { id:'cafe-oren', name:'Cafe Oren', desc:'', price:1.5, category:'Coffee', imgLabel:'photo:\ncafe oren', photo:'assets/cafe-oren.jpg' },

  // ---- calendar-date helpers (subscriptions) ----
  // Pure calendar-day arithmetic — deliberately avoids local-timezone Date
  // parsing quirks, since these are plain "YYYY-MM-DD" days, not instants.
  function todayDateStr(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function addDaysToDateStr(dateStr, n){
    var p = dateStr.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    d.setUTCDate(d.getUTCDate() + n);
    var y = d.getUTCFullYear();
    var m = String(d.getUTCMonth() + 1).padStart(2, '0');
    var day = String(d.getUTCDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  // The shop is always closed Sundays, no matter what. On top of that, the
  // customer picks exactly which day(s) of the week they want their drink
  // (e.g. Mon, Wed, Fri, Sat) via a multi-select of weekday chips. Any day
  // not selected gets skipped and the range simply extends further, so the
  // customer still gets every day they paid (or were rewarded) for.
  var SUB_DAY_OPTS = [
    { dow: 1, label: 'Mon' }, { dow: 2, label: 'Tue' }, { dow: 3, label: 'Wed' },
    { dow: 4, label: 'Thu' }, { dow: 5, label: 'Fri' }, { dow: 6, label: 'Sat' },
  ];
  function isSelectedDateStr(dateStr, days){
    var p = dateStr.split('-').map(Number);
    var dow = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
    return days.indexOf(dow) !== -1;
  }
  function computeSubDatesForDays(startStr, totalDays, days){
    var out = [];
    var cur = startStr;
    var guard = 0;
    while (out.length < totalDays && guard < 400){
      guard++;
      if (isSelectedDateStr(cur, days)) out.push(cur);
      if (out.length < totalDays) cur = addDaysToDateStr(cur, 1);
    }
    return out;
  }
  function computeSubValidUntilForDays(startStr, totalDays, days){
    var dates = computeSubDatesForDays(startStr, totalDays, days);
    return dates.length ? dates[dates.length - 1] : startStr;
  }
  function addMonthToDateStr(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    d.setUTCMonth(d.getUTCMonth() + 1);
    var y = d.getUTCFullYear();
    var m = String(d.getUTCMonth() + 1).padStart(2, '0');
    var day = String(d.getUTCDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  // Start date must fall within today..+1 month, and can't land on a day the
  // customer didn't select (bumped forward, day by day, to the next selected
  // day; if none found before the max date, scan backward instead — a loop
  // rather than a single bump, since several days in a row can be
  // unselected, e.g. only Saturdays chosen).
  function clampSubStartDateForDays(dateStr, days){
    var min = todayDateStr();
    var max = addMonthToDateStr(min);
    var out = dateStr || min;
    if (out < min) out = min;
    if (out > max) out = max;
    if (!days.length) return out;
    var cur = out, i;
    for (i = 0; i < 40; i++){
      if (isSelectedDateStr(cur, days)) return cur;
      var next = addDaysToDateStr(cur, 1);
      if (next > max) break;
      cur = next;
    }
    cur = out;
    for (i = 0; i < 40; i++){
      if (isSelectedDateStr(cur, days)) return cur;
      var prev = addDaysToDateStr(cur, -1);
      if (prev < min) break;
      cur = prev;
    }
    return out;
  }
  // Walks forward from startStr and returns the date of the n-th selected
  // weekday (inclusive of startStr itself if it qualifies).
  function nthMatchingDate(startStr, days, n){
    var count = 0;
    var cur = startStr;
    var guard = 0;
    while (guard < 500){
      guard++;
      if (isSelectedDateStr(cur, days)){
        count++;
        if (count >= n) return cur;
      }
      cur = addDaysToDateStr(cur, 1);
    }
    return cur;
  }
  function formatCalendarDate(dateStr){
    if (!dateStr) return '';
    var p = dateStr.split('-');
    if (p.length !== 3) return dateStr;
    return parseInt(p[2], 10) + ' ' + (MONTH_NAMES[parseInt(p[1], 10) - 1] || '') + ' ' + p[0];
  }
  // "DD/MM/YYYY - HH:MM" in Cambodia local time, matching the Telegram

  function formatOrderTime(iso){
    var date = iso ? new Date(iso) : new Date();
    if (isNaN(date.getTime())) return '';
    var parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Phnom_Penh', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false,
    }).formatToParts(date);
    function get(t){ var f = parts.find(function(p){ return p.type === t; }); return f ? f.value : ''; }
    return get('day') + '/' + get('month') + '/' + get('year') + ' - ' + get('hour') + ':' + get('minute');
  }

  function subBonusDays(){ return state.freeCups > 0 ? 1 : 0; }

  function computeTotal(){
    var cart = state.cart, subtotal = 0;
    Object.keys(cart).forEach(function(k){
      var entry = cart[k];
      var m = MENU.find(function(x){ return x.id === entry.id; });
      if (m) subtotal += unitPrice(m, entry.sugar, entry.addons) * entry.qty;
    });
    var discount = 0;
    if (state.redeemFreeCup && state.freeCups > 0){
      var prices = Object.keys(cart).map(function(k){
        var entry = cart[k];
        var m = MENU.find(function(x){ return x.id === entry.id; });
        return unitPrice(m, entry.sugar, entry.addons);
      });
      if (prices.length){
        var rawDiscount = Math.max.apply(null, prices);
        // A redeemed free cup is capped to the price of the customer's last
        // order (server-enforced too), so they can't earn stamps on cheap
        // drinks and redeem a pricier one for free.
        var cap = (typeof state.lastCupPrice === 'number' && !isNaN(state.lastCupPrice)) ? state.lastCupPrice : rawDiscount;
        discount = Math.min(rawDiscount, cap);
      }
    }
    return { subtotal: subtotal, discount: discount, total: Math.max(0, subtotal - discount) };
  }

  // ---- payment status polling (customer-facing cross-check) ----
  // After the customer taps "I've Paid", we poll the same order-status
  // endpoint staff use, so the confirm screen reflects whether the order
  // has actually been matched to a bank alert or tapped "Paid" by staff —
  // instead of only showing the unrelated Received/Preparing/Ready timer.
  var POLL_INTERVAL_MS = 4000;
  var POLL_MAX_ATTEMPTS = 45; // ~3 minutes
  var pollTimer = null;
  var pollAttempts = 0;
  var pollOrderCode = null;

  function stopPaymentStatusPolling(){
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    pollAttempts = 0;
    pollOrderCode = null;
  }

  function startPaymentStatusPolling(code){
    stopPaymentStatusPolling();
    pollOrderCode = code;
    pollAttempts = 0;

    function tick(){
      if (state.screen !== 'confirm' || state.orderCode !== pollOrderCode || pollAttempts >= POLL_MAX_ATTEMPTS){
        stopPaymentStatusPolling();
        return;
      }
      pollAttempts++;
      fetch(ORDER_STATUS_ENDPOINT + '?code=' + encodeURIComponent(pollOrderCode))
        .then(function(res){ return res.json().catch(function(){ return {}; }); })
        .then(function(data){
          if (state.screen !== 'confirm' || state.orderCode !== pollOrderCode) return;
          if (!data || !data.ok) return; // order not found yet / transient error — keep polling
          var status = (data.status === 'paid' || data.status === 'unpaid') ? data.status : 'pending';
          setState(function(s){
            var patch = { paymentStatus: status };
            if (data.orderType === 'subscription' && data.subValidUntil && s.confirmSubInfo){
              patch.confirmSubInfo = Object.assign({}, s.confirmSubInfo, { validUntil: data.subValidUntil });
            }
            return patch;
          });
          if (status !== 'pending') stopPaymentStatusPolling();
        })
        .catch(function(err){ console.error('Payment status poll failed', err); });
    }

    tick();
    pollTimer = setInterval(tick, POLL_INTERVAL_MS);
  }

  function pay(){
    if (state.pendingSubscription) return paySubscription(state.pendingSubscription);

    var totals = computeTotal();
    var cart = state.cart;
    var spentFreeCup = state.redeemFreeCup && state.freeCups > 0 ? 1 : 0;
    var remark = (state.remark || '').trim().slice(0, 50);
    var timestamp = new Date().toISOString();

    var orderPayload = {
      items: Object.keys(cart).map(function(k){
        var e = cart[k];
        var m = MENU.find(function(x){ return x.id === e.id; });
        return {
          name: m ? m.name : e.id, qty: e.qty, sugar: e.sugar,
          addons: addonLabels(e.addons),
          unitPrice: m ? unitPrice(m, e.sugar, e.addons) : 0,
        };
      }),
      subtotal: totals.subtotal, discount: totals.discount, total: totals.total,
      redeemedFreeCup: !!spentFreeCup,
      remark: remark,
      customer: tgUser ? {
        id: tgUser.id, firstName: tgUser.first_name, lastName: tgUser.last_name, username: tgUser.username,
      } : null,
      timestamp: timestamp,

    // Stamps/free cups are now tracked server-side (Redis), keyed by Telegram
    // user id, so they persist across visits instead of resetting per session.
    // The confirm/rewards screens pick up the authoritative values once the
    // /api/order response comes back (see sendOrder below). The Inv. ID is
    // also assigned server-side (an atomic Redis sequence, see api/order.js)
    // so it's guaranteed unique — orderCode starts null here and the confirm
    // screen shows a brief "generating" placeholder until sendOrder's
    // response fills it in and kicks off payment-status polling.
    setState({
      screen: 'confirm', orderCode: null, cart: {},
      redeemFreeCup: false, showReceiptNotice: false, remark: '',
      paymentStatus: 'pending', orderTime: timestamp, confirmSubInfo: null,
    });

    sendOrder(orderPayload);
  }

  function paySubscription(sub){
    var remark = (sub.remark || '').trim().slice(0, 50);
    var timestamp = new Date().toISOString();

    var orderPayload = {
      orderType: 'subscription',
      items: [{
        name: sub.item.name, qty: 1, sugar: sub.sugar,
        addons: addonLabels(sub.addons),
        unitPrice: sub.unitPrice,
      }],
      subStartDate: sub.startDate, subDays: sub.days, subDaysOfWeek: sub.daysOfWeek,
      subtotal: sub.total, discount: 0, total: sub.total,
      redeemedFreeCup: false,
      remark: remark,
      customer: tgUser ? {
        id: tgUser.id, firstName: tgUser.first_name, lastName: tgUser.last_name, username: tgUser.username,
      } : null,
      timestamp: timestamp,
    };

    setState({
      screen: 'confirm', orderCode: null,
      pendingSubscription: null, showReceiptNotice: false,
      paymentStatus: 'pending', orderTime: timestamp,
      confirmSubInfo: {
        validUntil: sub.validUntil, itemName: sub.item.name, days: sub.days,
        bonusDays: sub.bonusDays || 0, startDate: sub.startDate,
      },
    });

    sendOrder(orderPayload);
  }

  function sendOrder(payload){
    fetch(ORDER_ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    }).then(function(res){
      return res.json().catch(function(){ return {}; });
    }).then(function(data){
      if (!data || !data.ok) return;
      setState(function(s){
        var patch = { showReceiptNotice: !!data.customerNotified };
        if (data.orderCode) patch.orderCode = data.orderCode;
        if (typeof data.stamps === 'number') patch.stamps = data.stamps;
        if (typeof data.freeCups === 'number') patch.freeCups = data.freeCups;
        if (typeof data.lastCupPrice === 'number' && !isNaN(data.lastCupPrice)) patch.lastCupPrice = data.lastCupPrice;
        if (data.subValidUntil && s.confirmSubInfo){
          patch.confirmSubInfo = Object.assign({}, s.confirmSubInfo, {
            validUntil: data.subValidUntil,
            bonusDays: typeof data.subBonusDays === 'number' ? data.subBonusDays : s.confirmSubInfo.bonusDays,
          });
        }
        return patch;
      });
      // The Inv. ID is only known once the server assigns it (see api/order.js),
      // so payment-status polling — which is keyed by that code — only starts
      // now, not back when the confirm screen first appeared.
      if (data.orderCode) startPaymentStatusPolling(data.orderCode);
    }).catch(function(err){ console.error('Order notify failed', err); });
  }

  function loadStamps(){
    if (!tgUser || tgUser.id == null) return;
    fetch('/api/stamps?userId=' + encodeURIComponent(tgUser.id))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok){
          var patch = { stamps: data.stamps, freeCups: data.freeCups };
          if (typeof data.lastCupPrice === 'number' && !isNaN(data.lastCupPrice)) patch.lastCupPrice = data.lastCupPrice;
          setState(patch);
        }
      })
      .catch(function(err){ console.error('Failed to load stamps', err); });
  }

    else if (state.screen === 'item') html = renderItem();

    else if (state.screen === 'pay') html = renderPay();

    else if (state.screen === 'rewards') html = renderRewards();
    content.innerHTML = html;

    document.getElementById('headerTitle').textContent = screenTitle();

    document.getElementById('backBtn').className = 'back-btn' + (showBack ? ' show' : '');

      cartBar.className = '';
      cartBar.textContent = '';

  // ---- main button (Telegram native, fallback custom) ----
  function updateMainButton(){
    var showMain = ['item','cart','pay','subscribe','confirm'].indexOf(state.screen) !== -1;
    var label, action;
    if (state.screen === 'confirm'){
      label = 'Done';
      action = backHome;
    } else if (state.screen === 'item'){
      var m = MENU.find(function(x){ return x.id === state.selectedItemId; }) || MENU[0];
      var unit = unitPrice(m, state.sugar, state.addons);
      label = 'Add to bag · $' + money(unit * state.itemQty);
      action = addToCart;
    } else if (state.screen === 'subscribe'){
      var sm = MENU.find(function(x){ return x.id === state.subItemId; }) || MENU[0];
      var sunit = unitPrice(sm, state.subSugar, state.subAddons);
      var sdays = state.subDaysOfWeek.length;
      label = 'Subscribe · $' + money(sunit * sdays);
      action = goSubscriptionPay;
    } else if (state.screen === 'cart'){
      var totals = computeTotal();
      var keys = Object.keys(state.cart);
      if (keys.length === 0){ showMain = false; }
      label = "Pay · $" + money(totals.total);
      action = goPay;
    } else if (state.screen === 'pay'){
      label = "I've Paid";
      action = pay;
    }

    var wrap = document.getElementById('main-btn-wrap');
    var btn = document.getElementById('main-btn');

    if (tg && tg.MainButton){
      if (showMain){
        tg.MainButton.setText(label);
        tg.MainButton.show();
        tg.MainButton.offClick(mainButtonHandler);
        mainButtonHandler = action;
        tg.MainButton.onClick(mainButtonHandler);
      } else {
        tg.MainButton.hide();
      }
      wrap.className = '';
      document.getElementById('content').className = '';
    } else {
      if (showMain){
        wrap.className = 'show';
        btn.textContent = label;
        btn.onclick = action;
        document.getElementById('content').className = 'has-fallback-btn';
      } else {
        wrap.className = '';
        document.getElementById('content').className = '';
      }
    }
  }
  var mainButtonHandler = null;

  // ---- event binding ----
  function bindScreenEvents(){
    var content = document.getElementById('content');

    content.querySelectorAll('[data-cat]').forEach(function(el){
      el.addEventListener('click', function(){ setCategory(el.getAttribute('data-cat')); });
    });
    content.querySelectorAll('[data-layout]').forEach(function(el){
      el.addEventListener('click', function(){ setMenuLayout(el.getAttribute('data-layout')); });
    });
    content.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){ openItem(el.getAttribute('data-open')); });
    });
    content.querySelectorAll('[data-inc]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); cartInc(el.getAttribute('data-inc')); });
    });
    content.querySelectorAll('[data-dec]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); cartDec(el.getAttribute('data-dec')); });
    });
    content.querySelectorAll('[data-sugar]').forEach(function(el){
      el.addEventListener('click', function(){ setSugar(el.getAttribute('data-sugar')); });
    });
    content.querySelectorAll('[data-addon-inc]').forEach(function(el){
      el.addEventListener('click', function(){ incAddon(el.getAttribute('data-addon-inc')); });
    });
    content.querySelectorAll('[data-addon-dec]').forEach(function(el){
      el.addEventListener('click', function(){ decAddon(el.getAttribute('data-addon-dec')); });
    });
    var itemInc = document.getElementById('itemInc');
    if (itemInc) itemInc.addEventListener('click', incItemQty);
    var itemDec = document.getElementById('itemDec');
    if (itemDec) itemDec.addEventListener('click', decItemQty);

    var subscribeLink = document.getElementById('subscribeLink');
    if (subscribeLink) subscribeLink.addEventListener('click', openSubscribe);

    content.querySelectorAll('[data-sub-sugar]').forEach(function(el){
      el.addEventListener('click', function(){ setSubSugar(el.getAttribute('data-sub-sugar')); });
    });
    content.querySelectorAll('[data-sub-addon-inc]').forEach(function(el){
      el.addEventListener('click', function(){ incSubAddon(el.getAttribute('data-sub-addon-inc')); });
    });
    content.querySelectorAll('[data-sub-addon-dec]').forEach(function(el){
      el.addEventListener('click', function(){ decSubAddon(el.getAttribute('data-sub-addon-dec')); });
    });
    content.querySelectorAll('[data-sub-day]').forEach(function(el){
      el.addEventListener('click', function(){ toggleSubDay(parseInt(el.getAttribute('data-sub-day'), 10)); });
    });
    var subStartInput = document.getElementById('subStartInput');
    if (subStartInput) subStartInput.addEventListener('change', function(e){ setSubStartDate(e.target.value); });
    var subRemarkInput = document.getElementById('subRemarkInput');
    if (subRemarkInput){
      subRemarkInput.addEventListener('input', function(e){
        var v = e.target.value.slice(0, 50);
        if (v !== e.target.value) e.target.value = v;
        state.subRemark = v;
        var counter = document.getElementById('subRemarkCount');
        if (counter) counter.textContent = v.length + '/50';
      });
    }

    content.querySelectorAll('[data-cart-inc]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-cart-inc'); var e = state.cart[key];
        cartInc(e.id, e.sugar, e.addons);
      });
    });
    content.querySelectorAll('[data-cart-dec]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-cart-dec'); var e = state.cart[key];
        cartDec(e.id, e.sugar, e.addons);
      });
    });

    var redeemToggle = document.getElementById('redeemToggle');
    if (redeemToggle) redeemToggle.addEventListener('click', toggleRedeem);

    // Update state.remark directly (no setState/full re-render) so the
    // textarea keeps focus and cursor position while typing.
    var remarkInput = document.getElementById('remarkInput');
    if (remarkInput){
      remarkInput.addEventListener('input', function(e){
        var v = e.target.value.slice(0, 50);
        if (v !== e.target.value) e.target.value = v;
        state.remark = v;
        var counter = document.getElementById('remarkCount');
        if (counter) counter.textContent = v.length + '/50';
      });
    }

    var rewardsBtn = document.getElementById('rewardsBtn');
    if (rewardsBtn) rewardsBtn.addEventListener('click', goRewards);

    var qrShareBtn = document.getElementById('qrShareBtn');
    if (qrShareBtn) qrShareBtn.addEventListener('click', shareQR);
  }

  document.getElementById('backBtn').addEventListener('click', backHome);
  document.getElementById('closeBtn').addEventListener('click', backHome);
  document.getElementById('cart-bar').addEventListener('click', goCart);

  // ---- Telegram BackButton wiring ----
  function updateTgBackButton(){
    if (!tg || !tg.BackButton) return;
    var showBack = ['item','cart','rewards','pay','subscribe'].indexOf(state.screen) !== -1;
    if (showBack) tg.BackButton.show(); else tg.BackButton.hide();
  }
  var origSetState = setState;
  setState = function(patch){ origSetState(patch); updateTgBackButton(); };

  // ---- boot ----
  if (tg){
    try { tg.ready(); } catch(e){}
    try { tg.expand(); } catch(e){}
    try { tg.setHeaderColor('#FBF1E1'); } catch(e){}
    try { tg.setBackgroundColor('#FBF1E1'); } catch(e){}
    if (tg.BackButton) tg.BackButton.onClick(backHome);
  }

  render();
  updateTgBackButton();
  loadStamps();
})();
</script>
</body>
</html>
